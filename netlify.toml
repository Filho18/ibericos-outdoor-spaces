# C.T.Ibéricos — site estático (HTML/CSS/JS) + função serverless de email
[build]
  # Site estático (sem framework). O "build" apenas copia os ficheiros para dist/,
  # porque a UI do Netlify (herança do antigo Vite/React) espera publish=dist.
  # Assim funciona independentemente do que estiver configurado na UI.
  command = "rm -rf dist && mkdir -p dist && cp -r index.html pergolas-e-toldos toldos toldos-portugal toldos-motorizados toldos-varanda-terraco toldos-verticais toldos-retrateis toldos-esplanada toldos-loja assets robots.txt sitemap.xml dist/"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # O email casadostoldos@gmail.com é contacto público no site e é o valor de
  # EMAIL_USER/EMAIL_TO — omitimos essas chaves do secrets scanning para não dar
  # falso positivo. EMAIL_PASS (o segredo real) continua a ser scanneado.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_USER,EMAIL_TO"

[functions]
  # Garante que o nodemailer é empacotado com a função.
  node_bundler = "esbuild"
